[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-compression-benchmark"
version = "0.1.3"
description = "Reproducible benchmark for LLM compression: baseline, quantization, pruning, distillation, and quantization+distillation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LLM Compression Benchmark contributors"}]
dependencies = [
  "torch>=2.2",
  "transformers>=4.48,<6",
  "datasets>=3.0",
  "accelerate>=1.0",
  "PyYAML>=6.0",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "safetensors>=0.4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.45"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
llm-compression-benchmark = "llm_compression_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
