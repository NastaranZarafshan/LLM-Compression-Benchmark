experiment:
  name: pythia-quick-smoke
  seed: 42
  output_dir: outputs/quick

model:
  teacher: EleutherAI/pythia-70m
  student: EleutherAI/pythia-70m
  trust_remote_code: false

methods:
  baseline: true
  quantization: true
  pruning: true
  distillation: false
  quantization_distillation: false

quantization:
  bits: 8
  backend: auto

pruning:
  amount: 0.10
  sweep_amounts: []

distillation:
  temperature: 2.0
  alpha_kl: 0.70
  learning_rate: 5.0e-5
  batch_size: 2
  gradient_accumulation_steps: 1
  max_steps: 2
  warmup_steps: 0
  weight_decay: 0.0
  max_grad_norm: 1.0
  fp16: false

data:
  dataset_name: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  text_column: text
  train_split: train
  eval_split: validation
  block_size: 128
  max_train_samples: 128
  max_eval_samples: 128

benchmark:
  device: auto
  eval_batch_size: 2
  eval_max_batches: 4
  generation_batch_size: 1
  prompt: "Compression is useful because"
  max_new_tokens: 8
  warmup_runs: 1
  timed_runs: 2
  save_models: false

plot:
  size_metric: model_size_mb
  performance_metric: accuracy
